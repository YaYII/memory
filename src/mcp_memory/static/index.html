<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>MCP 认知中枢 (Cognitive Brain)</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- Import Maps for Three.js and Dependencies -->
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "three/examples/jsm/": "https://unpkg.com/three@0.160.0/examples/jsm/",
            "3d-force-graph": "https://unpkg.com/3d-force-graph@1.73.1/dist/3d-force-graph.mjs",
            "three-forcegraph": "https://unpkg.com/three-forcegraph@1.41.6/dist/three-forcegraph.mjs",
            "force-graph": "https://unpkg.com/force-graph@1.43.5/dist/force-graph.mjs",
            "three-render-objects": "https://unpkg.com/three-render-objects@1.29.2/dist/three-render-objects.mjs",
            "accessor-fn": "https://unpkg.com/accessor-fn@1.5.1/dist/accessor-fn.mjs",
            "kapsule": "https://unpkg.com/kapsule@1.14.5/dist/kapsule.mjs",
            "three-spritetext": "https://unpkg.com/three-spritetext@1.8.2/dist/three-spritetext.mjs"
        }
    }
    </script>
</head>
<body>
    <div class="scanline"></div>
    <div id="canvas-container"></div>
    
    <div id="ui-layer">
        <div class="panel stat-card">
            <h1>系统状态监控</h1>
            <div class="stat-row"><span>记忆总量 (MEMORIES)</span><span class="stat-val" id="mem-count">0</span></div>
            <div class="stat-row"><span>知识实体 (ENTITIES)</span><span class="stat-val" id="entity-count">0</span></div>
            <div class="stat-row"><span>服务状态 (STATUS)</span><span class="stat-val" id="status" style="color: #00ff41;">运行中</span></div>
            <div class="stat-row"><span>大脑活动 (ACTIVITY)</span><span class="stat-val" id="activity">待机</span></div>
        </div>

        <div class="panel legend-panel">
            <h1>记忆分区 (ZONES)</h1>
            <div class="legend-item"><div class="dot" style="background: #00ffff; color: #00ffff;"></div>Coding (编程技能)</div>
            <div class="legend-item"><div class="dot" style="background: #ff00ff; color: #ff00ff;"></div>Config (环境配置)</div>
            <div class="legend-item"><div class="dot" style="background: #ffff00; color: #ffff00;"></div>Personal (用户画像)</div>
            <div class="legend-item"><div class="dot" style="background: #ffffff; color: #ffffff;"></div>General (通用知识)</div>
            <div class="legend-item"><div class="dot" style="background: #ff4500; color: #ff4500;"></div>Entity (关联实体)</div>
        </div>

        <div class="panel log-panel">
            <h1>神经日志流 (NEURAL LOGS)</h1>
            <div id="log-content"></div>
        </div>
    </div>

    <script type="module" src="/static/js/app.js"></script>
</body>
</html>
