<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>MCP Cognitive Brain</title>
    <style>
        body { margin: 0; overflow: hidden; background-color: #000; color: #fff; font-family: 'Courier New', Courier, monospace; }
        #canvas-container { position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 1; }
        #ui-layer { position: absolute; top: 20px; left: 20px; z-index: 2; pointer-events: none; }
        .log-panel { 
            position: absolute; bottom: 20px; left: 20px; width: 400px; height: 200px; 
            background: rgba(0, 20, 40, 0.8); border: 1px solid #00ffff; 
            border-radius: 5px; padding: 10px; overflow-y: auto; 
            font-size: 12px; color: #00ffff; box-shadow: 0 0 10px #00ffff;
            pointer-events: auto;
        }
        .stat-card {
            background: rgba(0, 20, 40, 0.8); border: 1px solid #00ffff;
            padding: 15px; border-radius: 5px; margin-bottom: 10px;
            box-shadow: 0 0 10px #00ffff;
        }
        h1 { margin: 0 0 10px 0; font-size: 24px; text-shadow: 0 0 10px #00ffff; }
        .spark { color: #ff00ff; font-weight: bold; }
        ::-webkit-scrollbar { width: 5px; }
        ::-webkit-scrollbar-track { background: #001428; }
        ::-webkit-scrollbar-thumb { background: #00ffff; }
    </style>
    <!-- Force Graph Library -->
    <script src="//unpkg.com/force-graph"></script>
</head>
<body>
    <div id="canvas-container"></div>
    
    <div id="ui-layer">
        <div class="stat-card">
            <h1>🧠 MCP Cognitive Brain</h1>
            <div>Memories: <span id="mem-count">0</span></div>
            <div>Status: <span id="status" style="color: #00ff00;">ONLINE</span></div>
            <div>Brain Activity: <span id="activity">Idle</span></div>
        </div>
    </div>

    <div class="log-panel" id="log-panel">
        <div>> System initialized...</div>
        <div>> Connecting to neural network...</div>
    </div>

    <script>
        // --- 1. Data & State ---
        let graphData = { nodes: [], links: [] };
        const Graph = ForceGraph()(document.getElementById('canvas-container'))
            .backgroundColor('#000000')
            .nodeColor(node => node.type === 'memory' ? '#00ffff' : '#ff00ff')
            .nodeVal(node => node.type === 'memory' ? 2 : 4)
            .nodeLabel('id')
            .linkColor(() => 'rgba(255,255,255,0.2)')
            .linkWidth(1)
            .onNodeClick(node => {
                // Focus camera on node
                Graph.centerAt(node.x, node.y, 1000);
                Graph.zoom(8, 2000);
            });

        // --- 2. Real-time Visualization Logic ---
        function updateGraph(newData) {
            // Merge new data (simple implementation)
            // In a real app, we would do smart diffing
            const existingNodes = new Set(graphData.nodes.map(n => n.id));
            const existingLinks = new Set(graphData.links.map(l => `${l.source.id || l.source}-${l.target.id || l.target}`));
            
            let hasChanges = false;
            
            newData.nodes.forEach(n => {
                if (!existingNodes.has(n.id)) {
                    graphData.nodes.push(n);
                    hasChanges = true;
                    log(`New Neuron: ${n.id} (${n.type})`);
                }
            });
            
            newData.links.forEach(l => {
                const linkId = `${l.source}-${l.target}`;
                if (!existingLinks.has(linkId)) {
                    graphData.links.push(l);
                    hasChanges = true;
                }
            });

            if (hasChanges) {
                Graph.graphData(graphData);
            }
        }

        function triggerSpark(nodeId) {
            // Simulate a "thought spark" - flash a node and its neighbors
            const node = graphData.nodes.find(n => n.id === nodeId);
            if (!node) return;

            // Visual effect: temporary color change or particle emission
            // ForceGraph doesn't have built-in sparks, so we pulse the size/color
            const originalColor = node.color;
            node.color = '#ffffff'; // Flash white
            node.val = 10; // Expand
            
            Graph.graphData(graphData); // Re-render
            
            setTimeout(() => {
                node.color = undefined; // Reset to default function
                node.val = node.type === 'memory' ? 2 : 4;
                Graph.graphData(graphData);
            }, 500);
        }

        // --- 3. Polling & Event Loop ---
        function log(msg) {
            const panel = document.getElementById('log-panel');
            const div = document.createElement('div');
            div.innerHTML = `> <span style="color: #aaa;">${new Date().toLocaleTimeString()}</span> ${msg}`;
            panel.appendChild(div);
            panel.scrollTop = panel.scrollHeight;
        }

        async function fetchState() {
            try {
                // Fetch stats
                const statsRes = await fetch('/dashboard/stats');
                const stats = await statsRes.json();
                document.getElementById('mem-count').innerText = stats.memory_count;
                
                // Fetch Graph Data (Nodes/Links)
                const graphRes = await fetch('/dashboard/graph');
                const graph = await graphRes.json();
                updateGraph(graph);

                // Fetch Logs to trigger sparks
                const logsRes = await fetch('/dashboard/logs');
                const logsData = await logsRes.json();
                const latestLog = logsData.logs[logsData.logs.length - 1];
                
                if (latestLog && latestLog.message !== lastLogMsg) {
                    lastLogMsg = latestLog.message;
                    log(latestLog.message);
                    
                    // Simple heuristic: if log mentions a memory ID or entity, spark it
                    // Assuming log format: "Reading memory..." or "Writing memory..."
                    document.getElementById('activity').innerText = "Processing...";
                    document.getElementById('activity').style.color = "#ff00ff";
                    
                    // Simulate random sparks for "aliveness"
                    if (graphData.nodes.length > 0) {
                        const randomNode = graphData.nodes[Math.floor(Math.random() * graphData.nodes.length)];
                        triggerSpark(randomNode.id);
                    }
                } else {
                    document.getElementById('activity').innerText = "Idle";
                    document.getElementById('activity').style.color = "#888";
                }

            } catch (e) {
                console.error(e);
            }
        }

        let lastLogMsg = "";
        setInterval(fetchState, 2000); // 2s polling

        // Initial load
        fetchState();
        
        // Add some dummy initial data for visualization if empty
        setTimeout(() => {
            if (graphData.nodes.length === 0) {
                log("Initializing empty brain state...");
            }
        }, 1000);

    </script>
</body>
</html>
