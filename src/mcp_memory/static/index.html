<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <title>MCP 认知中枢 (Cognitive Brain)</title>
    <link rel="stylesheet" href="/static/css/style.css">
    <!-- Import Maps for Three.js and Dependencies -->
    <script type="importmap">
    {
        "imports": {
            "three": "//unpkg.com/three/build/three.module.js",
            "three/addons/": "//unpkg.com/three/examples/jsm/",
            "3d-force-graph": "//unpkg.com/3d-force-graph/dist/3d-force-graph.mjs"
        }
    }
    </script>
</head>
<body>
    <div class="scanline"></div>
    <div id="canvas-container"></div>
    
    <div id="ui-layer">
        <div class="panel stat-card">
            <h1>SYSTEM STATUS</h1>
            <div class="stat-row"><span>MEMORIES</span><span class="stat-val" id="mem-count">0</span></div>
            <div class="stat-row"><span>ENTITIES</span><span class="stat-val" id="entity-count">0</span></div>
            <div class="stat-row"><span>STATUS</span><span class="stat-val" id="status" style="color: #00ff41;">ONLINE</span></div>
            <div class="stat-row"><span>BRAIN ACTIVITY</span><span class="stat-val" id="activity">IDLE</span></div>
        </div>

        <div class="panel legend-panel">
            <h1>MEMORY ZONES</h1>
            <div class="legend-item"><div class="dot" style="background: #00ffff; color: #00ffff;"></div>Coding (编程)</div>
            <div class="legend-item"><div class="dot" style="background: #ff00ff; color: #ff00ff;"></div>Config (配置)</div>
            <div class="legend-item"><div class="dot" style="background: #ffff00; color: #ffff00;"></div>Personal (画像)</div>
            <div class="legend-item"><div class="dot" style="background: #ffffff; color: #ffffff;"></div>General (通用)</div>
            <div class="legend-item"><div class="dot" style="background: #ff4500; color: #ff4500;"></div>Entity (实体)</div>
        </div>

        <div class="panel log-panel">
            <h1>NEURAL LOG STREAM</h1>
            <div id="log-content"></div>
        </div>
    </div>

    <script type="module" src="/static/js/app.js"></script>
</body>
</html>
