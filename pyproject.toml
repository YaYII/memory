[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-memory"
version = "2.1.0"
description = "A biologically-inspired, self-evolving AI memory system for MCP protocol"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "MCP Memory Team" }]

dependencies = [
    # HTTP 服务
    "fastapi>=0.111.0,<1.0",
    "uvicorn[standard]>=0.29.0",
    "sse-starlette>=2.0.0",
    "httpx>=0.27.0",

    # 数据验证
    "pydantic>=2.7.0,<3.0",
    "pydantic-settings>=2.3.0",

    # 向量数据库
    "chromadb>=0.5.0",
    "sentence-transformers>=3.0.0",

    # 搜索
    "rank-bm25>=0.2.2",
    "jieba>=0.42.1",

    # 图数据库
    "networkx>=3.3",

    # 重试
    "tenacity>=8.3.0",

    # 环境配置
    "python-dotenv>=1.0.1",

    # CLI 工具
    "typer>=0.12.0",
    "rich>=13.7.0",
    "click>=8.1.7",

    # TUI
    "textual>=0.63.0",
]

[project.optional-dependencies]
# 限流（推荐生产环境安装）
rate-limit = ["slowapi>=0.1.9"]

# 开发工具
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "ruff>=0.4.0",
    "mypy>=1.10.0",
    "slowapi>=0.1.9",
]

[project.scripts]
mcp-memory-cli   = "mcp_memory.cli:app"
mcp-memory-local = "mcp_memory.cli_local:app"
memory           = "mcp_memory.cli_unified:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_memory"]

# ─── Ruff 配置（代码风格）────────────────────────────────────────────────────
[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "SIM", # flake8-simplify
]
ignore = [
    "E501",   # line too long（由 ruff format 处理）
    "B008",   # do not perform function calls in default arguments（FastAPI Depends 需要）
    "SIM108", # Use ternary operator（可读性优先）
]

[tool.ruff.lint.isort]
known-first-party = ["mcp_memory"]

# ─── Pytest 配置 ─────────────────────────────────────────────────────────────
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = [
    "ignore::DeprecationWarning",
    "ignore::UserWarning:chromadb",
]

# ─── MyPy 配置 ────────────────────────────────────────────────────────────────
[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
