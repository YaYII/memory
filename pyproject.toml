[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-memory"
version = "0.1.0"
description = "A biological-inspired memory system for AI agents using MCP protocol"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
authors = [
    { name = "MCP Team", email = "info@mcp.io" }
]
dependencies = [
    "mcp[cli]>=0.1.0",
    "chromadb>=0.4.0",
    "sentence-transformers>=2.2.0",
    "fastapi>=0.100.0",
    "uvicorn[standard]>=0.20.0",
    "pydantic>=2.0.0",
    "pydantic-settings>=2.0.0",
    "typer>=0.9.0",
    "rich>=13.0.0"
]

[project.scripts]
mcp-memory = "mcp_memory.main:main"
mcp-memory-cli = "mcp_memory.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_memory"]
