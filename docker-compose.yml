version: "3.9"

services:
  # ─── MCP Memory 主服务 ────────────────────────────────────────────────────
  mcp-memory:
    build:
      context: .
      dockerfile: Dockerfile
      target: runtime
    image: mcp-memory:latest
    container_name: mcp-memory
    restart: unless-stopped
    ports:
      - "127.0.0.1:22888:22888"   # 仅绑定本地，通过 nginx/caddy 反向代理暴露
    volumes:
      - chroma_data:/data/chroma
    environment:
      # 核心配置——生产环境应通过 .env 文件或 Secrets 管理提供
      MCP_MEMORY_HOST: "0.0.0.0"
      MCP_MEMORY_PORT: "22888"
      MCP_MEMORY_API_KEY: "${MCP_MEMORY_API_KEY:-}"
      MCP_MEMORY_LANGUAGE: "${MCP_MEMORY_LANGUAGE:-简体中文}"
      MCP_LOG_FORMAT: "json"
      MCP_LOG_LEVEL: "${MCP_LOG_LEVEL:-INFO}"
      # LLM 配置
      DEEPSEEK_API_KEY: "${DEEPSEEK_API_KEY:-}"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GLM_API_KEY: "${GLM_API_KEY:-}"
      # 进化引擎
      MCP_EVOLUTION_ENABLED: "${MCP_EVOLUTION_ENABLED:-true}"
      MCP_EVOLUTION_PROFILE: "${MCP_EVOLUTION_PROFILE:-standard}"
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:22888/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s
    networks:
      - mcp_net
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "5"

  # ─── 反向代理（可选，生产环境推荐）──────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: mcp-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/certs:/etc/nginx/certs:ro
    depends_on:
      mcp-memory:
        condition: service_healthy
    networks:
      - mcp_net
    profiles:
      - production   # 使用 --profile production 才会启动

volumes:
  chroma_data:
    driver: local
    driver_opts:
      type: none
      device: "${CHROMA_DATA_HOST_PATH:-./data/chroma}"
      o: bind

networks:
  mcp_net:
    driver: bridge
